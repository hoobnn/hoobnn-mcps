name: Probe Codex Connector bot trigger

on:
  push:
    branches: [ci/upstream-codex]
    paths: [.github/workflows/connector-probe.yml]

permissions:
  issues: write
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 1})).data;
            if (pr.state !== 'open' || pr.head.ref !== 'ci/upstream-codex') {
              throw new Error('Probe PR is not the expected open integration PR');
            }
            const marker = '<!-- connector-bot-probe:v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: 1
            });
            let comment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (!comment) {
              comment = (await github.rest.issues.createComment({
                ...context.repo, issue_number: 1,
                body: `${marker}\n@codex This is an authorized, narrowly scoped test of GitHub Actions bot task triggering. Add docs/audits/connector-probe.md with exactly one line: Actions Connector probe: bot-trigger-v1\nCommit and push this small documentation change back to this PR branch if supported. Do not edit other files, merge, approve, tag, publish, change repository settings, or invoke paid provider APIs. Do not include AI session URLs in the commit. Include Co-Authored-By: Codex <noreply@openai.com> as the commit trailer. If you cannot accept tasks from github-actions[bot], explain that limitation.\n\nWorkflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              })).data;
            }
            core.info(`Probe comment: ${comment.html_url}`);
            await core.summary.addLink('Bot trigger probe comment', comment.html_url).write();

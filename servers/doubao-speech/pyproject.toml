[project]
name = "doubao-speech-mcp"
version = "0.4.0"
description = "火山引擎豆包语音全产品 HTTP / WebSocket MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hoobnn" }]
keywords = ["mcp", "mcp-server", "volcengine", "doubao", "tts", "asr", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "websockets>=15,<17", "protobuf>=6.31.1,<7"]

[project.urls]
Homepage = "https://github.com/hoobnn/hoobnn-mcps/tree/main/servers/doubao-speech"
Repository = "https://github.com/hoobnn/hoobnn-mcps"
Issues = "https://github.com/hoobnn/hoobnn-mcps/issues"

[project.scripts]
doubao-speech-mcp = "doubao_speech_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "README.md"]

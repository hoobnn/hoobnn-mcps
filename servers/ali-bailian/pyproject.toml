[project]
name = "ali-bailian-mcp"
version = "0.5.0"
description = "阿里云百炼图像、语言、语音、定制音色、视频、向量与任务恢复 MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hoobnn" }]
keywords = ["mcp", "mcp-server", "dashscope", "bailian", "qwen", "wan", "tts", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/hoobnn/hoobnn-mcps/tree/main/servers/ali-bailian"
Repository = "https://github.com/hoobnn/hoobnn-mcps"
Issues = "https://github.com/hoobnn/hoobnn-mcps/issues"

[project.scripts]
ali-bailian-mcp = "ali_bailian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md"]

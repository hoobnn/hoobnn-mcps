[project]
name = "ali-bailian-mcp"
version = "0.4.0"
description = "阿里云百炼图像、语言、语音、定制音色、视频、向量与任务恢复 MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1"]

[project.scripts]
ali-bailian-mcp = "ali_bailian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

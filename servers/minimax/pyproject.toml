[project]
name = "hoobnn-minimax-mcp"
version = "0.3.1"
description = "MiniMax H3 video, speech, image and music MCP with durable task recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hoobnn" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/hoobnn/hoobnn-mcps"

[project.scripts]
hoobnn-minimax-mcp = "minimax_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "README.en.md"]

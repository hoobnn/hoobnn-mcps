[project]
name = "seedream-mcp"
version = "0.2.0"
description = "火山方舟 Seedream 5.0（pro / lite）图片生成 MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
seedream-mcp = "seedream_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

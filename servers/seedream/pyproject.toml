[project]
name = "seedream-mcp"
version = "0.3.0"
description = "火山方舟图片、Seedance视频、语言模型、搜索、向量与任务恢复 MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
seedream-mcp = "seedream_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volcengine-ark-mcp"
version = "0.6.0"
description = "火山方舟图片、Seedance视频、语言模型、搜索、向量与任务恢复 MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hoobnn" }]
keywords = ["mcp", "mcp-server", "volcengine", "ark", "seedream", "seedance", "doubao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/hoobnn/hoobnn-mcps/tree/main/servers/volcengine-ark"
Repository = "https://github.com/hoobnn/hoobnn-mcps"
Issues = "https://github.com/hoobnn/hoobnn-mcps/issues"

[project.scripts]
volcengine-ark-mcp = "volcengine_ark_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md"]
